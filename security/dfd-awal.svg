
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: bold 27px Arial; fill: #14233b; }
      .label { font: bold 18px Arial; fill: #14233b; }
      .small { font: 14px Arial; fill: #334155; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .store { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 7; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="45" text-anchor="middle" class="title">DFD Awal KasVault</text>
  <text x="500" y="72" text-anchor="middle" class="small">Rancangan konseptual — bukan arsitektur produksi</text>

  <rect x="35" y="115" width="930" height="490" class="boundary" rx="18"/>
  <text x="55" y="140" class="small">Batas sistem KasVault (rancangan)</text>

  <rect x="75" y="235" width="190" height="105" class="box"/>
  <text x="170" y="270" text-anchor="middle" class="label">Pengguna</text>
  <text x="170" y="298" text-anchor="middle" class="small">Bendahara / Anggota</text>
  <text x="170" y="320" text-anchor="middle" class="small">Browser</text>

  <rect x="385" y="210" width="240" height="155" class="box"/>
  <text x="505" y="245" text-anchor="middle" class="label">Aplikasi KasVault</text>
  <text x="505" y="275" text-anchor="middle" class="small">Antarmuka web</text>
  <text x="505" y="300" text-anchor="middle" class="small">Validasi input</text>
  <text x="505" y="325" text-anchor="middle" class="small">Kontrol akses (rencana)</text>

  <path d="M265 260 L385 260" class="flow"/>
  <text x="325" y="240" text-anchor="middle" class="small">Permintaan</text>
  <path d="M385 315 L265 315" class="flow"/>
  <text x="325" y="340" text-anchor="middle" class="small">Respons</text>

  <rect x="730" y="230" width="190" height="125" class="store"/>
  <text x="825" y="265" text-anchor="middle" class="label">Database</text>
  <text x="825" y="292" text-anchor="middle" class="small">Rencana</text>
  <text x="825" y="317" text-anchor="middle" class="small">Transaksi / Iuran</text>
  <path d="M625 255 L730 255" class="flow"/>
  <text x="677" y="235" text-anchor="middle" class="small">Baca / tulis</text>
  <path d="M730 320 L625 320" class="flow"/>

  <rect x="100" y="420" width="350" height="125" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" rx="12"/>
  <text x="275" y="450" text-anchor="middle" class="label">Perlindungan Kriptografi</text>
  <text x="275" y="478" text-anchor="middle" class="small">Password hashing</text>
  <text x="275" y="502" text-anchor="middle" class="small">HTTPS saat deployment</text>
  <text x="275" y="526" text-anchor="middle" class="small">Enkripsi data tertentu bila perlu</text>

  <rect x="535" y="420" width="360" height="125" fill="#fff7ed" stroke="#c2410c" stroke-width="2" rx="12"/>
  <text x="715" y="450" text-anchor="middle" class="label">Aset Pendukung (Rencana)</text>
  <text x="715" y="478" text-anchor="middle" class="small">Secrets dan kunci disimpan terpisah</text>
  <text x="715" y="502" text-anchor="middle" class="small">Backup database</text>
  <text x="715" y="526" text-anchor="middle" class="small">Log aktivitas</text>

  <text x="500" y="650" text-anchor="middle" class="small">Aliran dan komponen akan diperbarui saat backend dan database diimplementasikan.</text>
</svg>
